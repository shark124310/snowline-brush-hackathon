[platformio]
default_envs = esp32s3-n16r8

[env]
platform = espressif32 @ 8.0.0
framework = arduino
board = esp32-s3-devkitc-1

; Use the N16R8 module's Quad SPI flash and Octal SPI PSRAM.
board_name = ESP32-S3 N16R8 (16 MB Flash / 8 MB PSRAM)
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = default_16MB.csv
board_build.arduino.memory_type = qio_opi
build_flags = -DBOARD_HAS_PSRAM

upload_protocol = esptool
monitor_speed = 115200

[env:esp32s3-n16r8]
; Serial console on UART0, for boards with a USB-to-UART bridge.

[env:esp32s3-n16r8-usb]
; Serial console on the ESP32-S3's native USB Serial/JTAG port.
build_flags =
    ${env.build_flags}
    -DARDUINO_USB_CDC_ON_BOOT=1

[env:esp32s3-n16r8-imu-usb]
; Prewired MPU6050/OLED test board, using its native USB connector.
extends = env:esp32s3-n16r8-usb
build_flags =
    ${env:esp32s3-n16r8-usb.build_flags}
    -DSNOWLINE_MPU_SDA=46
